<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="64" ry="64" fill="url(#bgGrad)" stroke="#0f3460" stroke-width="4"/>

  <!-- Document stack - back sheet -->
  <rect x="100" y="100" width="200" height="260" rx="12" ry="12" fill="#0f3460" opacity="0.5" transform="rotate(-8, 200, 230)"/>

  <!-- Document stack - middle sheet -->
  <rect x="120" y="90" width="200" height="260" rx="12" ry="12" fill="#533483" opacity="0.7" transform="rotate(-3, 220, 220)"/>

  <!-- Document stack - front sheet -->
  <rect x="140" y="80" width="200" height="260" rx="12" ry="12" fill="#e8e8e8"/>

  <!-- Code lines on front document -->
  <rect x="164" y="112" width="100" height="8" rx="4" fill="#0f3460" opacity="0.8"/>
  <rect x="164" y="132" width="140" height="8" rx="4" fill="#e94560" opacity="0.7"/>
  <rect x="164" y="152" width="80" height="8" rx="4" fill="#533483" opacity="0.6"/>
  <rect x="164" y="172" width="120" height="8" rx="4" fill="#0f3460" opacity="0.5"/>
  <rect x="164" y="192" width="60" height="8" rx="4" fill="#e94560" opacity="0.6"/>
  <rect x="164" y="212" width="130" height="8" rx="4" fill="#533483" opacity="0.5"/>
  <rect x="164" y="232" width="90" height="8" rx="4" fill="#0f3460" opacity="0.4"/>
  <rect x="164" y="252" width="110" height="8" rx="4" fill="#e94560" opacity="0.5"/>
  <rect x="164" y="272" width="70" height="8" rx="4" fill="#533483" opacity="0.4"/>
  <rect x="164" y="292" width="100" height="8" rx="4" fill="#0f3460" opacity="0.3"/>

  <!-- Export arrow -->
  <g transform="translate(310, 180)">
    <!-- Arrow shaft -->
    <rect x="0" y="28" width="100" height="24" rx="12" fill="url(#arrowGrad)"/>
    <!-- Arrow head -->
    <polygon points="90,0 140,40 90,80" fill="url(#arrowGrad)"/>
  </g>

  <!-- Output file -->
  <rect x="340" y="170" width="70" height="90" rx="8" ry="8" fill="#e8e8e8" stroke="#e94560" stroke-width="2"/>
  <text x="352" y="225" font-family="monospace" font-size="16" font-weight="bold" fill="#e94560">TXT</text>

  <!-- Bottom label -->
  <text x="256" y="420" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#e8e8e8" text-anchor="middle" letter-spacing="2">TEXT EXPORTER</text>

  <!-- Decorative dots -->
  <circle cx="100" cy="420" r="4" fill="#e94560" opacity="0.6"/>
  <circle cx="120" cy="420" r="4" fill="#533483" opacity="0.6"/>
  <circle cx="140" cy="420" r="4" fill="#0f3460" opacity="0.6"/>
  <circle cx="372" cy="420" r="4" fill="#0f3460" opacity="0.6"/>
  <circle cx="392" cy="420" r="4" fill="#533483" opacity="0.6"/>
  <circle cx="412" cy="420" r="4" fill="#e94560" opacity="0.6"/>
</svg>